name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # make validate (claude plugin validate) is deliberately not run here:
  # it needs the claude CLI and an authenticated environment. Run it
  # locally via `make check` before merging.
  lint-and-test:
    name: Lint + tests (claude-independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats-core
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: make lint
        run: make lint

      - name: make test
        run: make test

  # The pre-merge half of CLAUDE.md's one-bump-per-PR rule. The tag job below
  # also enforces it, but only after the merge — by which point the default
  # branch is already red and the code is already shipped-but-unreleased.
  # Blocking the merge is the useful end of the same invariant, which is why
  # both call the same script rather than restating the rule.
  #
  # A pass here can go stale: if another PR claims the same version and
  # merges first, nothing re-runs this check without an up-to-date-branches
  # rule or a merge queue. The tag job's post-merge check is the backstop
  # that keeps that race loud instead of silent.
  version-bump:
    name: Version bump for plugin changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed for the merge-base against the target branch.
          fetch-depth: 0

      - name: Require a version bump for release-sensitive changes
        # Via env, never inlined into run: — a base SHA is safer than a ref
        # name, and workflow inputs never belong in a shell command.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-version-bump.sh --base "$BASE_SHA"

  # Release tags are cut here, never by hand. The tag step lives after the
  # merge because the tag must point AT the commit that introduces the
  # version — a step in that gap is one a human drops, and it was dropped
  # for four consecutive releases (0.6.2 through 0.6.5 were tagged
  # retroactively). The logic lives in scripts/tag-release.sh rather than
  # inline here so it is shellcheck-clean under `make lint` and pinned by
  # tests/tag_release.bats; see that script's header for why the tag target
  # is derived from history rather than from HEAD.
  tag-release:
    name: Tag release on version bump
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    # Deliberately NOT in a concurrency group. `cancel-in-progress: false`
    # protects only the RUNNING job: a group keeps one pending run and
    # cancels it when a third enters, so a middle release could be canceled
    # outright and left permanently untagged. `queue: max` would raise that
    # ceiling to 100 rather than remove it. Neither is needed — the script
    # is race-safe by construction: concurrent runs resolve the same target
    # commit AND the same annotation (both derived from that commit, not
    # from HEAD), so they compute byte-identical tags; the loser of the push
    # re-fetches and verifies instead of assuming. Serialization here would
    # buy nothing and can only lose releases.
    permissions:
      # Required to push the tag ref. This is the only write scope in this
      # workflow; keep it scoped to this job, never at the top level.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history AND tags: the script resolves the version-introducing
          # commit by walking first-parent, and distinguishes "already
          # released" from "needs a tag" by inspecting existing tags.
          fetch-depth: 0

      - name: Tag if the plugin version is untagged
        run: ./scripts/tag-release.sh
