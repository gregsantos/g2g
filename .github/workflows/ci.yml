name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # make validate (claude plugin validate) is deliberately not run here:
  # it needs the claude CLI and an authenticated environment. Run it
  # locally via `make check` before merging.
  lint-and-test:
    name: Lint + tests (claude-independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats-core
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: make lint
        run: make lint

      - name: make test
        run: make test

  # Release tags are cut here, never by hand. The tag step lives after the
  # merge because the tag must point AT the merge commit that introduces the
  # version — a step in that gap is one a human drops, and it was dropped for
  # four consecutive releases (0.6.2 through 0.6.5 were tagged retroactively).
  # The job is idempotent: a merge that does not bump plugin.json finds its
  # tag already present and exits 0, so docs-only and non-plugin merges are
  # no-ops rather than errors.
  tag-release:
    name: Tag release on version bump
    if: github.event_name == 'push'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      # Required to push the tag ref. This is the only write scope in this
      # workflow; keep it scoped to this job, never at the top level.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed to tell "already released" from "needs a tag".
          fetch-depth: 0

      - name: Tag if the plugin version is untagged
        run: |
          set -euo pipefail

          version=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          if [[ -z "$version" || "$version" == "null" ]]; then
              echo "could not read .version from plugin/.claude-plugin/plugin.json"
              exit 1
          fi
          tag="g2g--v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists — nothing to release"
              exit 0
          fi

          # A version bump with no CHANGELOG entry is the one inconsistency
          # worth failing on: it means the paired-edit rule in CLAUDE.md was
          # broken, and a tag whose body would be empty is worse than no tag.
          if ! awk -v v="$version" '$1 == "##" && $2 == v { f = 1 } END { exit !f }' CHANGELOG.md; then
              echo "plugin.json is at ${version} but CHANGELOG.md has no '## ${version}' heading."
              echo "Bumps and CHANGELOG entries land in the same commit — see CLAUDE.md."
              exit 1
          fi

          # The tag body is that version's CHANGELOG section, so the release
          # note is never hand-written twice.
          body=$(awk -v v="$version" '
              $1 == "##" && $2 == v { inside = 1; next }
              inside && $1 == "##"  { exit }
              inside                { print }
          ' CHANGELOG.md)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          printf 'g2g %s\n%s\n' "$version" "$body" | git tag -a "$tag" -F -
          git push origin "$tag"
          echo "created and pushed ${tag}"
