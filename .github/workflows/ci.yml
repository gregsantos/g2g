name: CI

on:
  pull_request:

jobs:
  lint-and-test:
    name: Lint + tests (claude-independent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats-core
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: make lint
        run: make lint

      - name: make test
        run: make test
